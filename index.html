<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="/bulldogstats-logo-dog_head.png" type="image/png">
  <link rel="stylesheet" href="app.css?v=1.2.0">
  <title>Momentum | Training intelligence</title>
</head>
<body>  
  <main class="app">  
    <header class="top"><div class="brand"><img class="brand-logo" src="/bulldogstats-logo-dog_head.png" alt="Bulldog Stats">Momentum</div><div class="subtitle">Plan, Perform, Review</div><button type="button" class="icon-btn" id="openProfileSettings" aria-label="Training profile settings" style="font-size:19px">⚙</button></header>  
    <nav class="tabs" aria-label="Momentum navigation"><button class="tab active" data-view="home">Today</button><button class="tab" data-view="today">Plan</button><button class="tab" data-view="log">Log</button><button class="tab" data-view="review">Review</button><button class="tab" data-view="history">History</button></nav>  
    <div class="mobile-title" id="mobileTitle">Today</div>  
    <section class="view active" id="home"></section>  
    <section class="view" id="today"></section>  
    <section class="view" id="log"></section>  
    <section class="view" id="review"></section>  
    <section class="view" id="history"></section>  
  </main>

  <nav class="bottom" aria-label="Momentum navigation">  
    <button class="nav-item active" data-view="home"><b>⌂</b>Today</button>  
    <button class="nav-item" data-view="today"><b>◫</b>Plan</button>  
    <button class="nav-item" data-view="log"><b>＋</b>Log</button>  
    <button class="nav-item" data-view="review"><b>✓</b>Review</button>  
    <button class="nav-item" data-view="history"><b>↗</b>History</button>  
  </nav>

  <div class="toast" id="toast"></div>

  <!-- Sanctum Cloud Auth Modal -->
  <div id="sanctumModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <div class="eyebrow">Cloud Authentication</div>
        <h2 style="margin-top:6px">Sign in to Bulldog Statbook</h2>
        <p class="quiet" style="margin-top:4px">Connect your device to sync training history and enable Coach AI.</p>
      </div>
      <div id="sanctumError" class="error-banner hidden"></div>
      <form id="sanctumForm" class="set-form" style="margin-top:14px">
        <label class="field full">Email<input id="sanctumEmail" class="input" type="email" required></label>
        <label class="field full">Password<input id="sanctumPassword" class="input" type="password" placeholder="Enter password" required></label>
        <div class="actions" style="margin-top:14px;display:flex;gap:10px">
          <button type="submit" class="primary" id="sanctumLoginBtn" style="flex:1">Sign In &amp; Connect</button>
          <button type="button" class="secondary" id="sanctumCancelBtn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

<!-- Exercise Picker Modal -->
<div id="exercisePickerModal" class="modal-overlay hidden">
  <div class="modal-card">
    <div class="modal-header">
      <div class="eyebrow">Exercise Library</div>
      <h2 style="margin-top:6px">Select Exercise</h2>
    </div>

    <div class="field full" style="margin-top:14px">
      <input id="modalExerciseSearch" class="input" type="text" placeholder="Search exercises…" autocomplete="off">
    </div>

    <div id="modalExerciseList" class="stack" style="margin-top:14px;max-height:320px;overflow-y:auto">
      <div class="empty">Loading exercise library…</div>
    </div>

    <div class="actions" style="margin-top:14px;display:flex;gap:10px">
      <button type="button" class="secondary" id="modalCustomExerciseBtn" style="flex:1">Can't find it? Add custom</button>
    </div>
    <div class="actions" style="margin-top:8px">
      <button type="button" class="secondary" id="modalExerciseCancelBtn" style="width:100%">Cancel</button>
    </div>
  </div>
</div>

<div id="profileModal" class="modal-overlay hidden">
  <div class="modal-card profile-modal">
    <div class="modal-header" style="display:flex;justify-content:space-between;align-items:start;gap:10px">
      <div style="flex:1;min-width:0">
        <div class="eyebrow">Training profile</div>
        <h2 id="profileModalTitle" style="margin-top:6px">Training profile</h2>
      </div>
      <button type="button" class="icon-btn" id="profileModalClose" aria-label="Close" style="font-size:18px">✕</button>
    </div>

    <div id="profileProgressWrap" class="hidden" style="margin-top:12px">
      <div class="bar"><i id="profileProgressFill" style="width:0%"></i></div>
      <p class="quiet" id="profileProgressLabel" style="margin:6px 0 0"></p>
    </div>

    <div id="profileModalBody" style="margin-top:16px;max-height:60vh;overflow-y:auto;padding-right:2px"></div>
  </div>
</div>

  <script src="/data.js"></script>  
  <script src="/workout-cards.js"></script>  
  <script src="/planner.js?v=1.1.9"></script>  
  <script src="/sync.js"></script>  
  <script src="/app.js?v=1.1.9"></script>  
</body>  
</html>
