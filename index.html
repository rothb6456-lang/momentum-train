/* 7-Day Weekly Calendar Strip */
.calendar-strip-row {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  margin: 14px 0 18px;
}
.calendar-day-card {
  position: relative;
  background: var(--panel2, #182633);
  border: 1px solid var(--line, #2a3b47);
  border-radius: 12px;
  padding: 8px 4px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 2px;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
}
.calendar-day-card.is-today {
  border-color: var(--mint, #55e2b5);
}
.calendar-day-card.has-plan {
  background: #142a30;
  border-color: #2f7664;
}
.calendar-day-card .day-name {
  font-size: 10px;
  color: var(--muted, #9babb5);
  text-transform: uppercase;
  font-weight: 700;
}
.calendar-day-card .day-num {
  align-self: flex-end;
  font-size: 12px;
  font-weight: 800;
  color: var(--ink, #f3f7f8);
}
.calendar-day-card .plan-indicator {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 10px;
  text-align: left;
  color: var(--mint, #55e2b5);
  margin-top: 2px;
  font-weight: 700;
}
.calendar-day-card:not(.has-plan) .plan-indicator {
  color: var(--muted, #9babb5);
  font-weight: 400;
}
@media (max-width: 500px) {
  .calendar-strip-row { gap: 4px; }
  .calendar-day-card { padding: 6px 2px; border-radius: 9px; }
  .calendar-day-card .day-name { font-size: 9px; }
  .calendar-day-card .day-num { font-size: 11px; }
  .calendar-day-card .plan-indicator { font-size: 8px; }
}

/* Date Input Flex & Shadow DOM Fix */
.plan-date-container, .form-group-date {
  min-width: 0 !important;
  flex: 1 1 auto !important;
  overflow: hidden !important;
}
input[type="date"], .scheduled-date-input {
  box-sizing: border-box !important;
  width: 100% !important;
  max-width: 100% !important;
  min-width: 0 !important;
  padding-right: 32px !important;
  font-size: 0.95rem;
}
input[type="date"]::-webkit-calendar-picker-indicator {
  cursor: pointer;
  margin-left: -24px;
  padding: 0;
  opacity: 0.8;
}

    <header class="top"><div class="brand"><i class="mark"></i>Momentum</div><div class="subtitle">Training intelligence · TSR-aware</div><span class="status" id="dataStatus">Loading training data…</span></header>  
    <nav class="tabs" aria-label="Momentum navigation"><button class="tab active" data-view="home">Today</button><button class="tab" data-view="today">Plan</button><button class="tab" data-view="log">Log</button><button class="tab" data-view="review">Review</button><button class="tab" data-view="history">History</button></nav>  
    <div class="mobile-title" id="mobileTitle">Today</div>

  <!-- Sanctum Cloud Auth Modal -->
  <div id="sanctumModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <div class="eyebrow">Cloud Authentication</div>
        <h2 style="margin-top:6px">Sign in to Bulldog Statbook</h2>
        <p class="quiet" style="margin-top:4px">Connect your device to sync training history and enable Coach AI.</p>
      </div>
      <div id="sanctumError" class="error-banner hidden"></div>
      <form id="sanctumForm" class="set-form" style="margin-top:14px">
        <label class="field full">Email<input id="sanctumEmail" class="input" type="email" required></label>
        <label class="field full">Password<input id="sanctumPassword" class="input" type="password" placeholder="Enter password" required></label>
        <div class="actions" style="margin-top:14px;display:flex;gap:10px">
          <button type="submit" class="primary" id="sanctumLoginBtn" style="flex:1">Sign In &amp; Connect</button>
          <button type="button" class="secondary" id="sanctumCancelBtn">Cancel</button>
